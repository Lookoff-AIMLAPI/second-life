name: Bug
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This page is public. Do not paste keys, tokens, prompts or answers. For a security problem use [a private report](https://github.com/Lookoff-AIMLAPI/second-life/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. Copy the error text as it is.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: slife doctor
      description: |
        Run this in Terminal and paste what it prints. It shows paths, so replace your user name if you see it.
        `"/Applications/Second Life.app/Contents/MacOS/slife" doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where the model runs
      options:
        - Codex
        - AIMLAPI
        - My endpoint, Chat Completions
        - My endpoint, Responses
        - My endpoint, Anthropic Messages
        - The problem is not with a model
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Where you use it
      options:
        - Claude Code
        - Claude Desktop
        - The API
        - Installing or updating
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.1, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: The lines around the error from `slife logs`. They hold sizes and times. Read them before you paste.
      render: text
