name: release

# A tag v1.2.3 builds and publishes; a manual run only builds artifacts.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_SHA:0:7}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-suffix, got: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    runs-on: macos-15
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: |
          go vet ./...
          go test ./...
      - name: Build the universal app and DMG
        run: make mac-universal VERSION="$VERSION"
      - name: Check the bundled CLI and the architectures
        run: |
          cli="dist/Second Life.app/Contents/MacOS/slife"
          output="$("$cli" version)"
          echo "$output"
          [[ "$output" == *"$VERSION"* ]]
          lipo -archs "$cli"
          lipo -archs "dist/Second Life.app/Contents/MacOS/slife-tray"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/install.sh
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./...
      - name: Install NSIS if missing
        run: |
          $path = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $path)) {
            choco install nsis --version=3.13.0 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed" }
          }
          & $path /VERSION
          if ($LASTEXITCODE -ne 0) { throw "makensis does not run" }
      - name: Build the installer
        run: ./packaging/windows/build.ps1 -Version $env:VERSION
      - name: Install, check, upgrade, uninstall
        run: ./packaging/windows/test.ps1 -Setup "dist/Second-Life-$env:VERSION-windows-x64-setup.exe" -Version $env:VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, mac] # Windows builds are checked but not published yet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          name: mac
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd files
          sha256sum ./*.dmg ./*.zip install.sh > SHA256SUMS
          cat > ../notes.md <<'NOTES'
          Mac, macOS 13 or newer, Intel and Apple Silicon:

              curl -fsSL https://github.com/Lookoff-AIMLAPI/second-life/releases/latest/download/install.sh | sh

          To read the script first, download install.sh from the files below. The app is not notarized by Apple. A DMG downloaded with a browser carries a mark that stops it from starting; the installer explains that and asks.
          NOTES
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file ../notes.md "${prerelease[@]}" \
            ./*.dmg ./*.zip install.sh SHA256SUMS
